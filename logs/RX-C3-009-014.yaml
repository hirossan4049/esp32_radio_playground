- experiment_id: RX-C3-012
  title: Follow-the-writer continuous stream (timing valid, data invalid)
  capture_path: logs/RX-C3-012_stream_tests.txt, captures/cs_*.bin, captures/us_*.bin
  control_result: late=0 at 1 MS/s; USB 0.44-0.73 MB/s; data constant because owned banks are unreadable while running
