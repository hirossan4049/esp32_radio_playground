- experiment_id: RX-C3-024
  title: Analysis of a viewer recording at 2402 MHz (user-supplied, 4 MS/s event mode, gain 40)
  date: 2026-10-18
  capture_path: captures/web/esp32sdr_2402000kHz_2026-10-18T05-36-49-789Z.sigmf-* (not in git), host/nrf24.py
  result: 16 BLE adverts (5 AdvA) decoded; plus a strong 1 Mbps GFSK device, ~1 MHz wide, ~400 us packets every 16.0 ms during two ~2.5 s periods, 80 us short packets; 797/964 bursts clipped at gain 40; no nRF24 ESB CRC-16 framing match; no common 32-bit sync word found
  interpretation: unidentified proprietary 2.4 GHz link (mouse/keyboard/remote class); needs a lower-gain 16 MS/s event capture and knowledge of what was operated
- experiment_id: RX-C3-025
  title: Lighting remote at 2402 MHz - packet structure from a 16 MS/s viewer recording (on / off / on-long-press)
  date: 2026-10-18
  capture_path: captures/web/esp32sdr_2402000kHz_2026-10-18T05-48-38-849Z.sigmf-* (not in git), host/pkt.py
  result: 1 Mbps GFSK, 16 ms pitch, ~420 us packets; sync 0xADF645C7 then 0xCFBD; two alternating variants (0x4086.. and 0x6DBF..); in the 6DBF variant bytes 22-28 encode the command (on == long-press-on != off), bytes 29-36 change per press, byte 39 looks like a check byte; no standard CRC-8/16 or sum matched; not nRF24 ESB framing
  interpretation: proprietary 2.4 GHz remote protocol; button field identified, rolling/check fields unknown
- experiment_id: RX-C3-026
  title: Lighting remote, 120 s command-line capture (16 MS/s snapshot event mode, gain 22), seven buttons pressed by the user
  date: 2026-10-18
  capture_path: captures/web/remote_seq1.sigmf-* (not in git), host/remote_events.py
  result: activity only at 10-20, 25-40, 45-60 s (nothing after 60 s); 90 complete packets; variant 6DBF bytes 22-28 differ from the previous session (18 42/46/86 e5 40 00 00 01 vs 18 a2 e5 42 e5 42 05), byte 29 is a counter (+4 per ~1.3 s, continues across presses, 0x98..0xf8), bytes 30-36 change with it; 4086 variant fully varying
  interpretation: no stable plaintext button code; payload appears whitened/encrypted with the counter; identification needs the device model or more structured presses
- experiment_id: RX-C3-027
  title: Lighting remote, repeated single-button recordings (4 MS/s event mode)
  date: 2026-10-18
  capture_path: captures/web/remote_seq3.sigmf-*, remote_seq4.sigmf-* (not in git), host/lightremote.py
  result: byte 23 = command class (0x42 on, 0x46 off, 0x86 adjust) stable across sessions; byte 30 = parameter (a1/a2 brightness up, 60 brightness down, 90-93 daylight); byte 29 counter +4 per ~1.5 s; bytes 31-36 counter-derived; byte 39 check (unknown)
  interpretation: proprietary 2.4 GHz lighting remote, plaintext fields identified for on/off/adjust; derived-value generator and check byte still unknown
- experiment_id: RX-C3-028
  title: Lighting remote decoded live (remote_live.py): command classes and parameters confirmed in time order
  date: 2026-10-18
  capture_path: logs/remote_live.txt, captures/web/remote_live*.sigmf-* (not in git), docs/remote_2402.md
  result: byte 23 = 0x42 on / 0x46 off / 0x86 adjust; byte 30 bits 7..2 = 0x50 bright+, 0xa0 bright-, 0x60 daylight, 0x90 warm, 0x08 all-on (sub-format e5 43 ff fc); byte 30 bits 1..0 = packet sequence; bytes 28-29 = 14-bit counter
  interpretation: verified by a 7-button ordered test and a 5x brightness-up test; derived bytes 31-36 and check byte 39 remain unknown
