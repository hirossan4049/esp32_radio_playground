- experiment_id: RX-C3-015
  title: External RF reception confirmed by host-side DSSS decode of Wi-Fi beacons
  date: 2026-10-18
  soc: ESP32-C3 rev v0.4
  rx_method: wifi_rf_iq_dump 16 Msps, BURST 1.024 ms blocks at 1.50 ms pitch, forced gain 20/30/40
  rf_input_mhz: 2437 (ambient AP beacons; reference = chip MAC promiscuous counts, BSSID f2:c9:4e:24:c7:1a SSID LOCALHOUSE_SPACE -41 dBm)
  rx_tuning_mhz: [2437, 2300, 2600, 2437]
  capture_path: captures/b_*.json, captures/bc_2437_g20_blk*.bin, captures/bc_2437_g30_blk*.bin, logs/RX-C3-015_dsss_decode.txt
  control_result: 2437 -> bursts on the 102.4 ms TBTT grid (118/118 events with a +102.4 ms partner at gain 20); 2300 and 2600 -> 0 bursts
  result: 7/16 raw blocks decode with PLCP CRC OK; beacon FC 0x0080, A2=A3=f2:c9:4e:24:c7:1a, SSID LOCALHOUSE_SPACE, DS ch 6, seq 1,2,3,5 consecutive
  interpretation: verified; the dump engine I/Q is the downconverted external RF (frequency, period and content all match an independent reference)
- experiment_id: RX-C3-016
  title: Dump-engine characterisation with beacons and internal spurs as test signals
  date: 2026-10-18
  soc: ESP32-C3 rev v0.4
  rx_method: BURST series (gain 0..60), BURST catch at 80 MS/s and at LO 2432/2442, one-shot CAP at 16/80 MS/s with no packet
  rx_tuning_mhz: [2437, 2432, 2442, 2300]
  capture_path: captures/gs_2437_g*.json, captures/bc80_*, captures/bc_2432_*, captures/bc_2442_*, captures/m16_*, captures/m80_*, logs/RX-C3-016_mech_analysis.txt
  result: fs = 16.000 MS/s (beacon clock); analog bandwidth +-10..11 MHz; 16 MS/s mode aliases the -11 MHz spur to +5 MHz (no anti-alias filter); image >= 19 dB down; DC (-1,-8) LSB at 2437; noise rms I 2.7 Q 1.8; gain ~1 dB/step with a ~10 dB step at 25->30; bit17 not a packet trigger
  interpretation: verified; the engine delivers raw 10-bit analog-filtered I/Q at 80 MS/s, 16 MS/s is a plain 1/5 decimation
- experiment_id: RX-C3-017
  title: LO-fundamental sweep 1842-2803 MHz for k-th order (k=3,4,5) response to UHF ISDB-T broadcasts
  date: 2026-10-18
  soc: ESP32-C3 rev v0.4
  rx_method: 40 MS/s one-shot x6 per point, gain 60, median PSD, 3 MHz steps, 5/6 CKGEN mode below 2203 MHz, two runs
  rf_input_mhz: ambient (real ISDB-T broadcasts as the UHF source; LTE Band 1/3 downlinks observed)
  capture_path: logs/RX-C3-017_sweep1.json, logs/RX-C3-017_sweep2.json, logs/RX-C3-017_sweep_run.txt
  control_result: LTE Band 1 (2110-2170) and Band 3 (1845-1880) downlinks seen at +10..+30 dB with band edges exact -> 5/6 mode receives external RF
  result: no elevation at 3fc/4fc/5fc for channels 13-52; residual sigma 0.39 dB, max +1.3 dB at k*fc points
  interpretation: verified null; any k-th order UHF response is within +1.5 dB of the gain-60 noise floor in this environment
