- experiment_id: RX-C3-013
  title: Owner register bank mapping and live-read behaviour
  control_result: owner 2 -> 0x3FCA0000, 0xA -> 0x3FCB0000; both banks unreadable while the engine runs
  interpretation: no hardware double buffering
- experiment_id: RX-C3-014
